[pytest]
minversion = 8.0
pythonpath = src
testpaths = assignment/tests
addopts = -ra --strict-markers --import-mode=importlib
markers =
    regression: all assignment cases
    smoke: representative valid and invalid cases for every member and module
    boundary: boundary value analysis
    ecp: equivalence class partitioning
    length: validators.length.length
    between: validators.between.between
    mac: validators.mac_address.mac_address
    saim: cases allocated to Saim
    ahmed: cases allocated to Ahmed
